[Unit]
After=network-online.target redis-server.service
Wants=network-online.target redis-server.service

[Service]
# Allocator: jemalloc via preload (Unbound has no jemalloc configure flag;
# the old --with-libjemalloc build flag was a silent no-op → glibc malloc).
Environment=LD_PRELOAD=/usr/lib/x86_64-linux-gnu/libjemalloc.so.2
# jemalloc tuning (jemalloc 5.3): one arena per worker thread (default would be
# 4*ncpu=16 → dirty pages spread across 16 arenas); background_thread purges
# freed memory asynchronously (smoother RSS, no purge in the query hot path).
Environment=MALLOC_CONF=narenas:4,background_thread:true

# Restart policy for resilience
Restart=always
RestartSec=2

# File & process limits
LimitNOFILE=65535
LimitNPROC=4096
LimitMEMLOCK=infinity
TasksMax=infinity

# Hardening options
NoNewPrivileges=yes
ProtectSystem=full
PrivateTmp=true

# Logging
StandardOutput=journal
StandardError=journal
