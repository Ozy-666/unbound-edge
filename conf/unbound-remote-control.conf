remote-control:
    control-enable: yes
    # Keep 127.0.0.1 first: unbound-control sets up TLS from the first entry.
    # The socket below serves local readers (unbound-control -s).
    control-interface: 127.0.0.1
    control-interface: /run/unbound.ctl
    control-port: 8953
    control-use-cert: yes
    server-key-file: "/etc/unbound/unbound.conf.d/unbound_server.key"
    server-cert-file: "/etc/unbound/unbound.conf.d/unbound_server.pem"
    control-key-file: "/etc/unbound/unbound.conf.d/unbound_control.key"
    control-cert-file: "/etc/unbound/unbound.conf.d/unbound_control.pem"
