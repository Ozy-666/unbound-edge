# ============================================================================
# unbound.conf — resolver behind the https://dnsdoh.art public DoH/DoT service
# ============================================================================
# Published as part of: https://github.com/Ozy-666/unbound-edge
#
# Build: Unbound 1.25.2, linked against a pinned BoringSSL in /opt/boring,
#        compiled -O3 -march=znver2 -flto for AMD EPYC 7542 (Zen 2).
#        --enable-subnet --enable-tfo-client --enable-tfo-server
#        --with-libevent --with-pthreads --disable-gost
#
#        NOTE: jemalloc is NOT a build flag. Unbound has no --with-libjemalloc
#        option — passing it was silently ignored, so such builds ran on glibc
#        malloc. jemalloc is supplied at RUNTIME via LD_PRELOAD in the systemd
#        drop-in (see systemd/unbound.service.d/override.conf in the repo).
#
# Stack: AGH-Edge → unbound (127.0.0.1:5353, this file) → dnscrypt-proxy (5053)
#
# This instance is a VALIDATING FORWARDER, not a full recursor: DNSSEC is
# validated here, but recursion is delegated to dnscrypt-proxy, which carries
# the queries out encrypted. Nothing in this file is internet-facing — the
# listener is bound to loopback and AGH-Edge terminates all public traffic.
# ============================================================================

server:

    # ── Network & Logging ─────────────────────────────────────────────────
    verbosity: 1
    # Loopback only — AGH-Edge is the sole client and terminates public
    # traffic. Port 5353 keeps systemd-resolved / other :53 users out of
    # the way.
    interface: 127.0.0.1
    port: 5353

    # IPv6 is off end-to-end on this host: no AAAA outbound path is used, so
    # enabling it would only add failing paths and slow down resolution.
    do-ip4: yes
    do-ip6: no
    prefer-ip6: no
    do-udp: yes
    do-tcp: yes
    # systemd Type=notify runs unbound in the foreground; it must not fork.
    do-daemonize: no

    # ── Modules & DNSSEC ─────────────────────────────────────────────────
    # No subnetcache/respip module is loaded even though the binary supports
    # them — fewer modules on the query path, and neither is wanted here.
    module-config: "validator iterator"
    # REQUIRED for this topology: the forward target is 127.0.0.1@5053
    # (dnscrypt-proxy). With the default `yes`, unbound would refuse to query
    # its own loopback upstream and every lookup would fail.
    do-not-query-localhost: no
    # RFC 5011 automatic root trust-anchor maintenance. The file must be
    # writable by unbound. Initial bootstrap uses the system unbound-anchor,
    # which is deliberately NOT rebuilt against BoringSSL (no PKCS#7).
    auto-trust-anchor-file: "/var/lib/unbound/root.key"
    root-hints: "/var/lib/unbound/root.hints"

    # Insecure delegations (no DNSSEC chain expected)
    # ── leak-test infrastructure (intentionally unsigned for testing) ──
    # https://dnsdoh.art runs a DNS-leak test built on uniquely-named one-shot
    # lookups. caps-exempt exempts the zone from 0x20 query-name case
    # randomisation (`use-caps-for-id`); it is a no-op while that option is at
    # its default `no`, and is kept as a safeguard in case it is ever enabled.
    # The leak subdomain is intentionally left unsigned.
    caps-exempt: "dnsdoh.art"
    domain-insecure: "leak.dnsdoh.art"
    # ── reverse-lookup zones (often have broken or missing DNSSEC) ──
    domain-insecure: "arin.net."
    domain-insecure: "ripe.net."

    # ── Local zones (never query upstream, return NXDOMAIN) ──────────────
    # local-zone takes precedence over domain-insecure — no need to list these
    # under domain-insecure (would be dead code).
    local-zone: "local." always_nxdomain
    local-zone: "lan."   always_nxdomain
    local-zone: "home."  always_nxdomain
    local-zone: "corp."  always_nxdomain
    # Router brand local zones (CPE leaks)
    local-zone: "dlink."     always_nxdomain
    local-zone: "totolink."  always_nxdomain
    local-zone: "bbrouter."  always_nxdomain
    local-zone: "zonthg.local." always_nxdomain

    # ── Extended DNS Errors (RFC 8914) ───────────────────────────────────
    ede: yes
    ede-serve-expired: yes

    # ── Security Hardening ───────────────────────────────────────────────
    # chroot disabled: confinement is delegated to the systemd unit
    # (ProtectSystem=full, PrivateTmp, NoNewPrivileges). Chrooting as well
    # would break the absolute paths above for no added isolation.
    chroot: ""
    harden-glue: yes
    harden-large-queries: yes
    harden-dnssec-stripped: yes
    harden-algo-downgrade: yes
    harden-short-bufsize: yes
    hide-identity: yes
    identity: "Server"
    hide-version: yes
    deny-any: yes
    qname-minimisation: yes

    # ── EDNS / TCP Keepalive ─────────────────────────────────────────────
    edns-buffer-size: 1232
    edns-tcp-keepalive: yes
    edns-tcp-keepalive-timeout: 15000
    rrset-roundrobin: yes

    # ── TTL & Cache Settings ─────────────────────────────────────────────
    cache-min-ttl: 300
    cache-max-ttl: 86400
    cache-min-negative-ttl: 900
    neg-cache-size: 64m

    # ── Serve-Expired (Stale Cache for Snappy UX) ────────────────────────
    serve-expired: yes
    serve-expired-ttl: 86400
    serve-expired-client-timeout: 500
    serve-expired-reply-ttl: 30
    serve-expired-ttl-reset: yes

    # ── Performance ──────────────────────────────────────────────────────
    prefetch: yes
    prefetch-key: yes
    minimal-responses: yes
    aggressive-nsec: yes

    # 4 cores — slabs auto-configure to 4 (one slab per core)
    num-threads: 4

    # Cache sizes — fits ~100K+ records in 768MB total
    msg-cache-size: 256m
    rrset-cache-size: 512m
    # cache slabs = 2x num-threads (power of 2): finer-grained per-cache locking
    # to reduce contention under worst-case high-concurrency floods (headroom).
    msg-cache-slabs: 8
    rrset-cache-slabs: 8
    infra-cache-slabs: 8
    key-cache-slabs: 8

    # ── Connection & Budget Settings ─────────────────────────────────────
    outgoing-range: 8192
    num-queries-per-thread: 4096
    incoming-num-tcp: 1024
    outgoing-num-tcp: 2048
    tcp-idle-timeout: 30000

    # Drop UDP queries waiting in socket buffer > 3s (Linux)
    sock-queue-timeout: 3

    # ── Kernel Buffers (matches sysctl net.core.rmem_max=8388608) ────────
    so-reuseport: yes
    so-rcvbuf: 8m
    so-sndbuf: 8m

    # ── Anti-amplification: per-domain rate limit ────────────────────────
    # Caps queries-per-domain across all clients. Trips on TXT amplification
    # probes (supercell.com, calendly.com, etc. — large TXT responses).
    # 100/s per domain is way above organic traffic at our scale.
    # ratelimit-factor: 10 = let every 10th query through (don't black-hole).
    # ratelimit-backoff: keeps the lid on for 2s after trip even if rate drops.
    ratelimit: 100
    ratelimit-factor: 10
    ratelimit-backoff: yes

    # ── DNS Cookies (RFC 7873) ───────────────────────────────────────────
    # Anti-spoofing protection. Currently 0 clients send valid cookies,
    # but enabling is free and provides protection as adoption grows.
    answer-cookie: yes

    # ── Spoofed-reply circuit breaker ────────────────────────────────────
    # Tripped on sustained spoofed responses (defense-in-depth alongside
    # DNSSEC + cookies + query-id randomization).
    unwanted-reply-threshold: 1000

    # ── UDP response size cap (anti-amplification last resort) ───────────
    # Forces TCP fallback for responses >1232 bytes. EDNS-aware clients
    # negotiate this anyway; this enforces it.
    max-udp-size: 1232

    # ── Access Control ───────────────────────────────────────────────────
    # Default is to refuse everything not listed here. Only loopback needs
    # access, since every client arrives via AGH-Edge on this same host.
    access-control: 127.0.0.0/8 allow
    # The deployed host also allows its own public address (redacted here as a
    # documentation example). Substitute yours, or omit the line entirely —
    # `interface: 127.0.0.1` above means unbound never binds a public socket,
    # so this entry cannot expose the resolver on its own.
    access-control: 203.0.113.1 allow

    # ── Private Address Protection (RFC 1918 / RFC 4193) ─────────────────
    private-address: 192.168.0.0/16
    private-address: 169.254.0.0/16
    private-address: 172.16.0.0/12
    private-address: 10.0.0.0/8
    private-address: fd00::/8
    private-address: fe80::/10

    # ── Statistics ───────────────────────────────────────────────────────
    statistics-cumulative: yes
    statistics-interval: 0
    extended-statistics: yes

    # ── Logging (quiet for production) ───────────────────────────────────
    log-queries: no
    log-replies: no
    log-servfail: no
    log-local-actions: no
    val-log-level: 0
    logfile: /var/log/unbound/unbound.log

    # ── TLS bundle (system CA store for DoT-out, DoH-out if used) ────────
    # Present but unused: there is no tls-upstream here, so unbound opens no
    # TLS connections at all. This is why BoringSSL's TLS surface is not part
    # of this daemon's threat model — only libcrypto (DNSSEC) is exercised.
    tls-cert-bundle: "/etc/ssl/certs/ca-certificates.crt"

# ============================================================================
# Forwarding to local dnscrypt-proxy
# ============================================================================
# Everything goes to dnscrypt-proxy on loopback, which holds the encrypted
# upstreams (Cloudflare DoH / Quad9 DNSCrypt). unbound still validates DNSSEC
# itself, so a compromised or lying upstream cannot forge signed answers.
# Requires do-not-query-localhost: no (set above).
forward-zone:
    name: "."
    forward-addr: 127.0.0.1@5053

# Control socket for `unbound-control` (stats, cache dump/flush). The key and
# certificate files it references are NOT published in this repo — generate
# them locally with:  unbound-control-setup -d /etc/unbound/unbound.conf.d
include: "/etc/unbound/unbound.conf.d/unbound-remote-control.conf"